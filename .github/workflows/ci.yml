name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npx tsc --noEmit
      - name: engine and approval-gate tests
        run: npm test
      - name: production build
        run: npm run build
